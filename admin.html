
<div style="margin:16px 0;padding:12px;border:1px solid #ccc;border-radius:10px">
  <label for="galleryImage">মোবাইল গ্যালারি থেকে সংবাদ ছবি বেছে নিন</label>
  <input type="file" id="galleryImage" accept="image/*">
  <img id="galleryPreview" alt="ছবির প্রিভিউ" style="display:none;max-width:100%;max-height:250px;margin-top:12px">
</div>

<script>
document.getElementById('galleryImage').addEventListener('change',function(){
  const file=this.files[0];
  const preview=document.getElementById('galleryPreview');
  if(!file)return;
  if(!file.type.startsWith('image/')){
    alert('দয়া করে একটি ছবি নির্বাচন করুন।');
    return;
  }
  preview.src=URL.createObjectURL(file);
  preview.style.display='block';
});
</script>
</body>
</html>
